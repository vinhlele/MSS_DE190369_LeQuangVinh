spring.application.name=de190369ReservationService

server.port=8082
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

room.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.room-service.connect-timeout=3000
spring.cloud.openfeign.client.config.room-service.read-timeout=5000
spring.cloud.openfeign.client.config.room-service.logger-level=basic

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
